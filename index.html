<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>المحاسبة عبر الهاتف المحمول</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f5f5;
  color:#222;
}
header{
  background:#171717;
  color:#d4af37;
  padding:18px 15px;
  text-align:center;
  font-size:23px;
  font-weight:bold;
}
nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  padding:8px;
  background:#222;
}
nav button{
  border:0;
  padding:12px 4px;
  border-radius:8px;
  background:#333;
  color:white;
  font-size:13px;
}
nav button.active{
  background:#d4af37;
  color:#111;
}
.container{
  padding:12px;
  max-width:800px;
  margin:auto;
}
.page{display:none}
.page.active{display:block}
.card{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0001;
}
h2{margin-top:0;color:#222}
label{
  display:block;
  margin:10px 0 5px;
  font-weight:bold;
}
input,select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
  background:white;
}
button.main{
  width:100%;
  margin-top:12px;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#198754;
  color:white;
  font-size:17px;
  font-weight:bold;
}
button.gold{
  background:#d4af37;
  color:#111;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.stat{

  padding:15px 8px;
  border-radius:10px;
  background:#eee;
}
